[package]
name = "catsim_correct"
version = "0.1.2"
edition = "2024"
rust-version = "1.95"
license = "MIT"
authors = ["adventure-gpt"]
description = "catSim input correction for RLBot bots: lag correction and repaired flags, as a C library"

[lib]
name = "catsim_correct"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# The public catSim engine (MIT). Tag v0.1.3 is the engine the PyPI package catsim-rl 0.1.3 is built from.
catsim = { git = "https://github.com/adventure-gpt/catsim-public", tag = "v0.1.3", features = ["flow"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
panic = "unwind"
